<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<h1>Products List</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Client ID</th>
        <th>Specialist ID</th>
        <th>Model</th>
        <th>Status</th>
        <th>Cost</th>
    </tr>
    </thead>
    <tbody>
    {% for product in products %}
    <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.client }}</td>
        <td>{{ product.specialist }}</td>
        <td>{{ product.model }}</td>
        <td>{{ product.status }}</td>
        <td>{{ product.cost }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
